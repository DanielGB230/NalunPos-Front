<header class="h-16 bg-[#F4F6F8] border-b border-slate-200/90 px-4 md:px-6 flex items-center justify-between sticky top-0 z-40 transition-all duration-300 shadow-xs">
  <!-- Brand & System Status -->
  <div class="flex items-center space-x-4">
    <div class="flex items-center space-x-3">
      <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-purple-600 via-indigo-600 to-purple-700 flex items-center justify-center shadow-md shadow-purple-500/20 ring-1 ring-black/5">
        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0h5m-5 0V11m0 0h5m-5 0h-5" />
        </svg>
      </div>
      <div class="flex flex-col">
        <span class="text-slate-900 font-extrabold text-base tracking-wider flex items-center gap-1.5">
          NALUN<span class="text-purple-600">POS</span>
          <span class="px-2 py-0.5 text-[10px] uppercase font-bold tracking-widest bg-purple-100 text-purple-700 border border-purple-200/80 rounded-full">
            SuperAdmin
          </span>
        </span>
      </div>
    </div>

    <!-- Separador vertical -->
    <div class="hidden sm:block h-5 w-[1px] bg-slate-300/80"></div>

    <!-- Status pill -->
    <div class="hidden sm:flex items-center space-x-2 px-3 py-1 bg-emerald-50 border border-emerald-200 rounded-full">
      <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
      <span class="text-xs font-semibold text-emerald-700 tracking-wide">Consola En Línea</span>
    </div>
  </div>

  <!-- Search & User Actions -->
  <div class="flex items-center space-x-4">
    <!-- Buscador global dinámico -->
    <div class="relative hidden lg:block w-72">
      <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
        <svg class="h-4 w-4 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
        </svg>
      </div>
      <input
        type="text"
        placeholder="Buscar Tenants, RUC, Emails..."
        class="w-full pl-9 pr-4 py-1.5 bg-white border border-slate-300 text-slate-800 text-xs rounded-xl focus:outline-none focus:ring-2 focus:ring-purple-500/20 focus:border-purple-600 placeholder-slate-400 shadow-2xs transition-all"
      />
    </div>

    <!-- Botón Notificaciones -->
    <button class="relative p-2 text-slate-600 hover:text-slate-900 bg-white hover:bg-slate-100/80 border border-slate-300 rounded-xl transition-all shadow-2xs">
      <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
      </svg>
      <span class="absolute top-1.5 right-1.5 w-2 h-2 bg-purple-600 rounded-full ring-2 ring-white"></span>
    </button>

    <!-- User Profile Dropdown -->
    <div class="relative">
      <button
        (click)="toggleUserMenu()"
        class="flex items-center space-x-3 p-1.5 rounded-xl bg-white hover:bg-slate-100/80 border border-slate-300 transition-all focus:outline-none shadow-2xs"
      >
        <div class="w-8 h-8 rounded-lg bg-gradient-to-tr from-purple-600 to-indigo-600 flex items-center justify-center text-white font-bold text-xs shadow-xs">
          {{ currentUser()?.email?.substring(0, 2)?.toUpperCase() || 'SA' }}
        </div>
        <div class="hidden sm:flex flex-col text-left pr-1">
          <span class="text-xs font-bold text-slate-800 truncate max-w-[130px]">
            {{ currentUser()?.email || 'SuperAdmin Central' }}
          </span>
          <span class="text-[10px] text-purple-600 font-medium">Plataforma Global</span>
        </div>
        <svg class="w-4 h-4 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Dropdown Menu -->
      <div
        *ngIf="showUserMenu()"
        class="absolute right-0 mt-2 w-56 bg-white border border-slate-200 rounded-2xl shadow-xl py-1.5 z-50 animate-in fade-in zoom-in-95 duration-150"
      >
        <div class="px-4 py-2 border-b border-slate-100">
          <p class="text-xs font-bold text-slate-800">SuperAdmin NalunPOS</p>
          <p class="text-[11px] text-slate-500 truncate">{{ currentUser()?.email }}</p>
        </div>
        <a
          href="javascript:void(0)"
          class="flex items-center space-x-2 px-4 py-2 text-xs font-medium text-slate-700 hover:bg-slate-50 hover:text-purple-600 transition-colors"
        >
          <svg class="w-4 h-4 text-purple-600" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span>Configuración Cuenta</span>
        </a>
        <div class="border-t border-slate-100 my-1"></div>
        <button
          (click)="logout()"
          class="w-full flex items-center space-x-2 px-4 py-2 text-xs font-medium text-rose-600 hover:bg-rose-50 transition-colors text-left"
        >
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span>Cerrar Sesión</span>
        </button>
      </div>
    </div>
  </div>
</header>
