<header class="h-[62px] shrink-0 sticky top-0 z-40 px-4 sm:px-6 border-b border-white/80 bg-white/70 backdrop-blur-2xl transition-all shadow-[0_4px_25px_rgba(172,160,231,0.08)] flex items-center justify-between">
  <!-- Indicador 'Consola En Línea' + Botones de Navegación -->
  <div class="flex items-center space-x-3 sm:space-x-4">
    <!-- Botón de 3 Rayas Móvil -->
    <button
      (click)="toggleMobileMenu()"
      type="button"
      class="md:hidden w-9 h-9 rounded-xl bg-white/40 hover:bg-white/70 border border-white/60 hover:border-white/80 text-[#605596] hover:text-[#161B2D] flex items-center justify-center transition-all shadow-xs cursor-pointer focus:outline-none"
      title="Abrir menú de módulos"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
      </svg>
    </button>

    <!-- Botón Contraer/Expandir Sidebar (Desktop) -->
    <button
      type="button"
      (click)="toggleSidebar()"
      [title]="isSidebarCollapsed() ? 'Expandir menú lateral' : 'Contraer menú lateral'"
      class="hidden md:flex w-9 h-9 rounded-xl bg-white/40 hover:bg-white/70 border border-white/60 hover:border-white/80 text-[#605596] hover:text-[#161B2D] items-center justify-center transition-all shadow-xs group cursor-pointer focus:outline-none"
    >
      <svg
        class="w-4 h-4 transition-transform duration-200"
        [class.rotate-180]="isSidebarCollapsed()"
        fill="none"
        stroke="currentColor"
        viewBox="0 0 24 24"
      >
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 19l-7-7 7-7m8 14l-7-7 7-7" />
      </svg>
    </button>

    <div class="flex items-center space-x-2 px-3 py-1 rounded-full bg-[#DBE6FB]/80 border border-[#92AAE7]/40 backdrop-blur-md shadow-xs">
      <span class="relative flex h-2.5 w-2.5 shrink-0">
        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-[#92AAE7] opacity-75"></span>
        <span class="relative inline-flex rounded-full h-2.5 w-2.5 bg-[#605596]"></span>
      </span>
      <span class="text-xs font-bold text-[#161B2D] tracking-wide">
        Módulo: {{ activeModuleName() }}
      </span>
      <span class="text-[10px] text-[#605596] font-mono pl-1.5 border-l border-[#92AAE7]/40 font-bold hidden sm:inline">
        Consola En Línea
      </span>
    </div>
  </div>

  <!-- Buscador interactivo 'Buscar Tenants, RUC/NIT, Subdominios, Emails...' con atajo '⌘K' -->
  <div class="hidden md:flex flex-1 max-w-xl mx-8">
    <div class="relative w-full group">
      <div class="absolute inset-0 bg-gradient-to-r from-[#ACA0E7]/20 to-[#92AAE7]/20 rounded-full blur-md opacity-0 group-hover:opacity-100 transition-opacity"></div>
      <div class="relative flex items-center w-full">
        <div class="absolute left-3.5 pointer-events-none text-[#ACA0E7]">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
        <input
          type="text"
          placeholder="Buscar Tenants, RUC/NIT, Subdominios, Emails..."
          class="w-full pl-10 pr-24 py-1.5 text-xs sm:text-sm bg-white/70 border border-[#DEDAF4] rounded-full focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#ACA0E7]/50 focus:border-[#ACA0E7] placeholder-[#605596]/60 transition-all shadow-inner"
        />
        <div class="absolute right-3 flex items-center space-x-1.5">
          <span class="px-2 py-0.5 text-[10px] font-mono font-semibold text-[#605596] bg-white/90 border border-[#DEDAF4] rounded-md shadow-xs">⌘K</span>
          <span class="w-2 h-2 rounded-full bg-[#92AAE7] animate-ping"></span>
        </div>
      </div>
    </div>
  </div>

  <!-- Acciones Header: Campana + Perfil -->
  <div class="flex items-center space-x-3">
    <!-- Campana de notificaciones -->
    <button
      class="relative p-2 rounded-full text-[#161B2D] hover:text-[#605596] hover:bg-white/80 border border-transparent hover:border-[#DEDAF4] transition shadow-xs"
      title="Notificaciones del sistema"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 01-6 0v-1m6 0H9" />
      </svg>
      <span class="absolute top-1.5 right-1.5 w-2.5 h-2.5 rounded-full bg-[#ACA0E7] ring-2 ring-white"></span>
    </button>

    <!-- Perfil del administrador -->
    <div class="relative">
      <button
        (click)="toggleUserMenu()"
        class="flex items-center pl-1.5 pr-2.5 py-1 rounded-full glass-surface border border-[#DEDAF4] shadow-xs hover:border-[#ACA0E7] transition cursor-pointer text-left focus:outline-none"
      >
        <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-[#ACA0E7] to-[#92AAE7] text-white font-bold text-[11px] flex items-center justify-center shadow-xs">
          {{ currentUser()?.email?.substring(0, 2)?.toUpperCase() || 'AD' }}
        </div>
        <div class="ml-2 hidden sm:flex flex-col text-left">
          <span class="text-xs font-bold text-[#161B2D] leading-tight truncate max-w-[130px]">
            {{ currentUser()?.email || 'admin@nalunpos.com' }}
          </span>
          <span class="text-[9px] font-semibold text-[#605596] tracking-wide font-mono">Plataforma Global</span>
        </div>
        <svg class="w-3.5 h-3.5 ml-1.5 text-[#ACA0E7]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
        </svg>
      </button>

      <!-- Dropdown Menu -->
      <div
        *ngIf="showUserMenu()"
        class="absolute right-0 mt-2 w-56 bg-white/95 border border-[#DEDAF4] rounded-2xl shadow-xl backdrop-blur-xl py-1.5 z-50 animate-in fade-in zoom-in-95 duration-150"
      >
        <div class="px-4 py-2 border-b border-[#DEDAF4]">
          <p class="text-xs font-bold text-[#161B2D]">SuperAdmin NalunPOS</p>
          <p class="text-[11px] text-[#605596] truncate font-mono">{{ currentUser()?.email }}</p>
        </div>
        <a
          href="javascript:void(0)"
          class="flex items-center space-x-2 px-4 py-2 text-xs font-medium text-[#161B2D] hover:bg-[#FAF8FF] hover:text-[#605596] transition-colors"
        >
          <svg class="w-4 h-4 text-[#ACA0E7]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          </svg>
          <span>Configuración Cuenta</span>
        </a>
        <div class="border-t border-[#DEDAF4] my-1"></div>
        <button
          (click)="logout()"
          class="w-full flex items-center space-x-2 px-4 py-2 text-xs font-bold text-rose-600 hover:bg-rose-50 transition-colors text-left"
        >
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
          </svg>
          <span>Cerrar Sesión</span>
        </button>
      </div>
    </div>
  </div>
</header>
