<div class="p-6 bg-[#0E121B] text-slate-100 rounded-2xl border border-slate-800 shadow-2xl max-w-lg w-full font-sans">
  <!-- Modal Header -->
  <div class="flex items-center justify-between pb-4 mb-6 border-b border-slate-800/80">
    <div class="flex items-center gap-3">
      <div class="p-2.5 rounded-xl bg-purple-500/10 border border-purple-500/20 text-purple-400">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5m0 0v-5a2 2 0 012-2h2a2 2 0 012 2v5m-6 0h6" />
        </svg>
      </div>
      <div>
        <h2 class="text-lg font-bold text-white tracking-tight">Nuevo Almacén</h2>
        <p class="text-xs text-slate-400 font-mono">Alta de bodega / centro de almacenamiento</p>
      </div>
    </div>
    <button
      type="button"
      (click)="onClose()"
      class="text-slate-400 hover:text-white p-1.5 rounded-lg hover:bg-slate-800/60 transition-colors"
      title="Cerrar modal"
    >
      <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
      </svg>
    </button>
  </div>

  <!-- Form Body -->
  <form (submit)="$event.preventDefault(); onSubmit()" class="space-y-4">
    <!-- Nombre -->
    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 font-mono">
        Nombre del Almacén <span class="text-purple-400">*</span>
      </label>
      <input
        type="text"
        [value]="name()"
        (input)="name.set($any($event.target).value)"
        placeholder="Ej: Almacén Principal, Bodega Central..."
        class="w-full px-3.5 py-2.5 bg-[#141A26] border border-slate-700/70 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 font-sans transition-all"
        required
      />
    </div>

    <!-- Sucursal (Branch) Selector -->
    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 font-mono">
        Sucursal Perteneciente <span class="text-purple-400">*</span>
      </label>
      <div class="relative">
        <select
          [value]="branchId()"
          (change)="branchId.set($any($event.target).value)"
          [disabled]="isLoadingBranches()"
          class="w-full px-3.5 py-2.5 bg-[#141A26] border border-slate-700/70 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 font-sans transition-all appearance-none cursor-pointer disabled:opacity-50"
        >
          <option value="" disabled class="bg-[#141A26] text-slate-400">
            {{ isLoadingBranches() ? 'Cargando sucursales...' : 'Seleccione una sucursal...' }}
          </option>
          @for (branch of branches(); track branch.id) {
            <option [value]="branch.id" class="bg-[#141A26] text-slate-200">
              {{ branch.name }} {{ branch.isMain ? '(Principal)' : '' }}
            </option>
          }
        </select>
        <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-3 text-slate-400">
          <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Descripción -->
    <div>
      <label class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5 font-mono">
        Descripción <span class="text-slate-500 font-normal">(Opcional)</span>
      </label>
      <textarea
        [value]="description()"
        (input)="description.set($any($event.target).value)"
        rows="3"
        placeholder="Notas de ubicación, capacidad o productos almacenados..."
        class="w-full px-3.5 py-2.5 bg-[#141A26] border border-slate-700/70 rounded-xl text-sm text-slate-100 placeholder-slate-500 focus:outline-none focus:border-purple-500 focus:ring-1 focus:ring-purple-500 font-sans transition-all resize-none"
      ></textarea>
    </div>

    <!-- Toggle Almacén Predeterminado -->
    <div class="p-3.5 bg-[#141A26]/80 rounded-xl border border-slate-800 flex items-center justify-between">
      <div class="pr-3">
        <span class="block text-xs font-semibold text-slate-200 font-mono">Almacén Predeterminado</span>
        <span class="block text-[11px] text-slate-400 mt-0.5">
          Asigna este almacén como principal para ventas e ingresos del sistema.
        </span>
      </div>
      <label class="relative inline-flex items-center cursor-pointer">
        <input
          type="checkbox"
          [checked]="isDefault()"
          (change)="isDefault.set($any($event.target).checked)"
          class="sr-only peer"
        />
        <div class="w-11 h-6 bg-slate-700 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-purple-600"></div>
      </label>
    </div>

    <!-- Modal Footer Actions -->
    <div class="flex items-center justify-end gap-3 pt-4 border-t border-slate-800/80 mt-6">
      <button
        type="button"
        (click)="onClose()"
        [disabled]="isSaving()"
        class="px-4 py-2 rounded-xl text-xs font-mono font-semibold text-slate-300 hover:text-white hover:bg-slate-800/80 transition-colors disabled:opacity-50"
      >
        CANCELAR
      </button>
      <button
        type="submit"
        [disabled]="isSaving() || !name().trim() || !branchId()"
        class="px-5 py-2 rounded-xl text-xs font-mono font-semibold bg-purple-600 hover:bg-purple-500 text-white shadow-lg shadow-purple-600/25 transition-all disabled:opacity-50 flex items-center gap-2"
      >
        @if (isSaving()) {
          <svg class="animate-spin h-3.5 w-3.5 text-white" viewBox="0 0 24 24" fill="none">
            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
          </svg>
          GUARDANDO...
        } @else {
          GUARDAR ALMACÉN
        }
      </button>
    </div>
  </form>
</div>
