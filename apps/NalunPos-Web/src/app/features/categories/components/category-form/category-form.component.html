<div class="relative flex flex-col w-full max-w-lg max-h-[90vh] bg-white/88 backdrop-blur-2xl border border-white/90 rounded-3xl p-6 sm:p-8 shadow-[0_25px_65px_rgba(172,160,231,0.18)] overflow-hidden text-brand-dark mx-auto">
  <!-- Ambient background diffuse glow -->
  <div class="absolute top-0 left-0 w-72 h-72 bg-primary-container/16 rounded-full blur-3xl pointer-events-none -translate-x-1/2 -translate-y-1/2"></div>
  <div class="absolute bottom-0 right-0 w-80 h-80 bg-sky-bright/12 rounded-full blur-3xl pointer-events-none translate-x-1/3 translate-y-1/3"></div>
  <!-- Top inner glow highlight line -->
  <div class="absolute top-0 left-0 right-0 h-0.5 bg-linear-to-r from-transparent via-[#ACA0E7]/60 to-transparent opacity-60 pointer-events-none"></div>

  <form (ngSubmit)="onSubmit()" class="relative z-10 flex flex-col flex-1 min-h-0">
    <!-- Modal Header -->
    <div class="shrink-0 flex items-start justify-between pb-5 border-b border-purple-soft mb-6">
      <div class="space-y-1.5 pr-6">
        <div class="flex flex-wrap items-center gap-2">
          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-sky-soft text-[#4338CA] border border-sky-bright/50 shadow-xs">
            Catálogo Comercial
          </span>
          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-purple-soft/70 text-[#4338CA] border border-primary-container/50 shadow-xs flex items-center gap-1">
            <svg class="w-3 h-3 text-[#4338CA]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
            </svg>
            POS Operativo v1.0
          </span>
        </div>
        <h2 class="font-display font-bold text-2xl sm:text-3xl text-brand-navy tracking-tight mt-1">
          @if (isEditing()) {
            Editar <span class="bg-linear-to-r from-[#4338CA] via-[#ACA0E7] to-[#92AAE7] bg-clip-text text-transparent">Categoría</span>
          } @else {
            Nueva <span class="bg-linear-to-r from-[#4338CA] via-[#ACA0E7] to-[#92AAE7] bg-clip-text text-transparent">Categoría</span>
          }
        </h2>
        <p class="text-xs sm:text-sm text-brand-muted font-normal leading-relaxed">
          @if (isEditing()) {
            Actualice los datos y detalles de la categoría seleccionada en el catálogo.
          } @else {
            Clasificación y organización de productos para el catálogo comercial y punto de venta.
          }
        </p>
      </div>
      <button 
        type="button" 
        class="w-9 h-9 shrink-0 rounded-2xl glass-surface border border-purple-soft hover:border-primary-container hover:bg-white text-brand-muted hover:text-brand-navy flex items-center justify-center transition duration-200 shadow-xs cursor-pointer" 
        (click)="onClose()" 
        title="Cerrar"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
        </svg>
      </button>
    </div>

    <!-- Form Inputs -->
    <div class="flex-1 overflow-y-auto min-h-0 space-y-4 pr-1">
      
      <!-- Nombre de Categoría -->
      <div class="space-y-1.5">
        <label class="text-[11px] font-bold uppercase tracking-wider text-brand-muted flex items-center justify-between">
          <span>Nombre de Categoría</span>
          <span class="text-[10px] text-[#4338CA] font-mono">Requerido</span>
        </label>
        <div class="relative flex items-center">
          <div class="absolute left-3.5 text-primary-container pointer-events-none">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M7 7h.01M7 3h5c.512 0 1.024.195 1.414.586l7 7a2 2 0 010 2.828l-7 7a2 2 0 01-2.828 0l-7-7A1.994 1.994 0 013 12V7a4 4 0 014-4z" />
            </svg>
          </div>
          <input 
            [value]="name()"
            (input)="name.set($any($event.target).value)"
            class="w-full pl-10 pr-3 py-2.5 text-xs sm:text-sm bg-white/70 border border-purple-soft rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#ACA0E7]/50 focus:border-primary-container text-brand-navy shadow-inner font-medium" 
            placeholder="Ej: Electrónica, Bebidas, Accesorios" 
            type="text"
          >
        </div>
      </div>

      <!-- Descripción (Opcional) -->
      <div class="space-y-1.5">
        <label class="text-[11px] font-bold uppercase tracking-wider text-brand-muted flex items-center justify-between">
          <span>Descripción (Opcional)</span>
        </label>
        <div class="relative flex items-start">
          <div class="absolute left-3.5 top-3 text-primary-container pointer-events-none">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 6h16M4 12h16M4 18h7" />
            </svg>
          </div>
          <textarea 
            rows="3"
            [value]="description()"
            (input)="description.set($any($event.target).value)"
            class="w-full pl-10 pr-3 py-2.5 text-xs sm:text-sm bg-white/70 border border-purple-soft rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#ACA0E7]/50 focus:border-primary-container text-brand-navy shadow-inner font-medium resize-none" 
            placeholder="Detalles opcionales sobre esta categoría de productos..."
          ></textarea>
        </div>
      </div>

    </div>

    <!-- Modal Footer Actions -->
    <div class="shrink-0 pt-5 mt-5 border-t border-purple-soft flex flex-col sm:flex-row items-center justify-end gap-3.5">
      <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
        <button 
          type="button" 
          [disabled]="isSaving()" 
          class="px-4 py-2.5 rounded-xl glass-surface hover:bg-white text-brand-navy font-semibold text-xs transition border border-purple-soft shadow-xs disabled:opacity-50 cursor-pointer" 
          (click)="onClose()"
        >
          Cancelar
        </button>
        <button 
          type="submit" 
          [disabled]="isSaving()" 
          class="inline-flex items-center px-6 py-2.5 rounded-xl bg-linear-to-r from-[#ACA0E7] via-[#92AAE7] to-[#4338CA] hover:opacity-95 text-white font-bold text-xs shadow-glass-glow hover:shadow-lg transition-all transform hover:-translate-y-0.5 active:translate-y-0 space-x-2 disabled:opacity-50 cursor-pointer"
        >
          @if (isSaving()) {
            <svg class="mr-1.5 h-4 w-4 animate-spin text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Guardando...</span>
          } @else {
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
            </svg>
            <span>{{ isEditing() ? 'Guardar Cambios' : 'Crear Categoría' }}</span>
          }
        </button>
      </div>
    </div>
  </form>
</div>
