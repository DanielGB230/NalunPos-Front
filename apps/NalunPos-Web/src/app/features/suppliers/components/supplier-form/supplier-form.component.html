<div class="relative flex flex-col w-full max-w-2xl max-h-[90vh] bg-white/88 backdrop-blur-2xl border border-white/90 rounded-3xl p-6 sm:p-8 shadow-[0_25px_65px_rgba(172,160,231,0.18)] overflow-hidden text-[#161B2D] mx-auto">
  <!-- Ambient background diffuse glow (azul más defuminado y suave) -->
  <div class="absolute top-0 left-0 w-72 h-72 bg-primary-container/16 rounded-full blur-3xl pointer-events-none -translate-x-1/2 -translate-y-1/2"></div>
  <div class="absolute bottom-0 right-0 w-80 h-80 bg-sky-bright/12 rounded-full blur-3xl pointer-events-none translate-x-1/3 translate-y-1/3"></div>
  <!-- Top inner glow highlight line -->
  <div class="absolute top-0 left-0 right-0 h-0.5 bg-linear-to-r from-transparent via-[#ACA0E7]/60 to-transparent opacity-60 pointer-events-none"></div>

  <form (submit)="onSubmit(); $event.preventDefault()" class="relative z-10 flex flex-col flex-1 min-h-0">
    <!-- Modal Header -->
    <div class="shrink-0 flex items-start justify-between pb-5 border-b border-purple-soft mb-6">
      <div class="space-y-1.5 pr-6">
        <div class="flex flex-wrap items-center gap-2">
          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-sky-soft text-[#4338CA] border border-sky-bright/50 shadow-xs">
            Directorio de Compras
          </span>
          <span class="px-2.5 py-0.5 rounded-full text-[10px] font-mono font-bold bg-purple-soft/70 text-[#4338CA] border border-primary-container/50 shadow-xs flex items-center gap-1">
            <svg class="w-3 h-3 text-[#4338CA]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 v5m-4 0h4" />
            </svg>
            POS Operativo v1.0
          </span>
        </div>
        <h2 class="font-display font-bold text-2xl sm:text-3xl text-[#161B2D] tracking-tight mt-1">
          {{ isEditing() ? 'Editar' : 'Nuevo' }} <span class="bg-linear-to-r from-[#4338CA] via-[#ACA0E7] to-[#92AAE7] bg-clip-text text-transparent">Proveedor</span>
        </h2>
        <p class="text-xs sm:text-sm text-[#605596] font-normal leading-relaxed">
          {{ isEditing() ? 'Modifique la información corporativa y datos de contacto del proveedor.' : 'Registro de un nuevo proveedor de productos o servicios comerciales.' }}
        </p>
      </div>
      <button 
        type="button" 
        class="w-9 h-9 shrink-0 rounded-2xl bg-white/60 border border-purple-soft hover:border-primary-container hover:bg-white text-[#605596] hover:text-[#161B2D] flex items-center justify-center transition duration-200 shadow-xs cursor-pointer" 
        (click)="onClose()" 
        title="Cerrar"
      >
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path d="M6 18L18 6M6 6l12 12" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2"></path>
        </svg>
      </button>
    </div>

    <!-- Form Inputs Container -->
    <div class="flex-1 overflow-y-auto min-h-0 space-y-4 pr-1 custom-scrollbar">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

        <!-- Razón Social / Nombre -->
        <div class="sm:col-span-2 space-y-1.5">
          <label class="text-[11px] font-bold uppercase tracking-wider text-[#605596] flex items-center justify-between font-mono">
            <span>Razón Social / Nombre Empresa</span>
            <span class="text-[10px] text-[#4338CA]">Requerido</span>
          </label>
          <input
            type="text"
            [value]="name()"
            (input)="name.set($any($event.target).value)"
            placeholder="Ej: Distribuidora Central S.A.C."
            class="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-white/70 border border-purple-soft rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#ACA0E7]/50 focus:border-primary-container text-[#161B2D] shadow-inner font-mono font-medium transition"
          />
        </div>

        <!-- Nombre Contacto -->
        <div class="space-y-1.5">
          <label class="text-[11px] font-bold uppercase tracking-wider text-[#605596] flex items-center justify-between font-mono">
            <span>Nombre de Contacto</span>
            <span class="text-[10px] text-[#4338CA]">Requerido</span>
          </label>
          <input
            type="text"
            [value]="contactName()"
            (input)="contactName.set($any($event.target).value)"
            placeholder="Ej: Juan Pérez"
            class="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-white/70 border border-purple-soft rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#ACA0E7]/50 focus:border-primary-container text-[#161B2D] shadow-inner font-mono font-medium transition"
          />
        </div>

        <!-- Tax ID (RUC/RFC) -->
        <div class="space-y-1.5">
          <label class="text-[11px] font-bold uppercase tracking-wider text-[#605596] flex items-center justify-between font-mono">
            <span>Tax ID / RUC / RFC</span>
            <span class="text-[10px] text-[#4338CA]">Requerido</span>
          </label>
          <input
            type="text"
            [value]="taxId()"
            (input)="taxId.set($any($event.target).value)"
            placeholder="Ej: 20123456789"
            class="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-white/70 border border-purple-soft rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#ACA0E7]/50 focus:border-primary-container text-[#161B2D] shadow-inner font-mono font-medium transition"
          />
        </div>

        <!-- Email -->
        <div class="space-y-1.5">
          <label class="text-[11px] font-bold uppercase tracking-wider text-[#605596] flex items-center justify-between font-mono">
            <span>Correo Electrónico</span>
            <span class="text-[10px] text-[#4338CA]">Requerido</span>
          </label>
          <input
            type="email"
            [value]="email()"
            (input)="email.set($any($event.target).value)"
            placeholder="contacto@proveedor.com"
            class="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-white/70 border border-purple-soft rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#ACA0E7]/50 focus:border-primary-container text-[#161B2D] shadow-inner font-mono font-medium transition"
          />
        </div>

        <!-- Teléfono -->
        <div class="space-y-1.5">
          <label class="text-[11px] font-bold uppercase tracking-wider text-[#605596] flex items-center justify-between font-mono">
            <span>Teléfono</span>
            <span class="text-[10px] text-[#4338CA]">Requerido</span>
          </label>
          <input
            type="text"
            [value]="phone()"
            (input)="phone.set($any($event.target).value)"
            placeholder="+51 987 654 321"
            class="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-white/70 border border-purple-soft rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#ACA0E7]/50 focus:border-primary-container text-[#161B2D] shadow-inner font-mono font-medium transition"
          />
        </div>

        <!-- Dirección / Calle -->
        <div class="sm:col-span-2 space-y-1.5">
          <label class="text-[11px] font-bold uppercase tracking-wider text-[#605596] flex items-center justify-between font-mono">
            <span>Dirección / Calle</span>
            <span class="text-[10px] text-[#4338CA]">Requerido</span>
          </label>
          <input
            type="text"
            [value]="street()"
            (input)="street.set($any($event.target).value)"
            placeholder="Av. Principal 123, Of. 402"
            class="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-white/70 border border-purple-soft rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#ACA0E7]/50 focus:border-primary-container text-[#161B2D] shadow-inner font-mono font-medium transition"
          />
        </div>

        <!-- Ciudad -->
        <div class="space-y-1.5">
          <label class="text-[11px] font-bold uppercase tracking-wider text-[#605596] flex items-center justify-between font-mono">
            <span>Ciudad</span>
            <span class="text-[10px] text-[#4338CA]">Requerido</span>
          </label>
          <input
            type="text"
            [value]="city()"
            (input)="city.set($any($event.target).value)"
            placeholder="Lima"
            class="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-white/70 border border-purple-soft rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#ACA0E7]/50 focus:border-primary-container text-[#161B2D] shadow-inner font-mono font-medium transition"
          />
        </div>

        <!-- Código Postal -->
        <div class="space-y-1.5">
          <label class="text-[11px] font-bold uppercase tracking-wider text-[#605596] flex items-center justify-between font-mono">
            <span>Código Postal</span>
            <span class="text-[10px] text-[#4338CA]">Requerido</span>
          </label>
          <input
            type="text"
            [value]="zipCode()"
            (input)="zipCode.set($any($event.target).value)"
            placeholder="15001"
            class="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-white/70 border border-purple-soft rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#ACA0E7]/50 focus:border-primary-container text-[#161B2D] shadow-inner font-mono font-medium transition"
          />
        </div>

        <!-- País -->
        <div class="space-y-1.5">
          <label class="text-[11px] font-bold uppercase tracking-wider text-[#605596] flex items-center justify-between font-mono">
            <span>País</span>
            <span class="text-[10px] text-[#4338CA]">Requerido</span>
          </label>
          <input
            type="text"
            [value]="country()"
            (input)="country.set($any($event.target).value)"
            placeholder="Perú"
            class="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-white/70 border border-purple-soft rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#ACA0E7]/50 focus:border-primary-container text-[#161B2D] shadow-inner font-mono font-medium transition"
          />
        </div>

        <!-- Código País Tax -->
        <div class="space-y-1.5">
          <label class="text-[11px] font-bold uppercase tracking-wider text-[#605596] flex items-center justify-between font-mono">
            <span>Código País Tax (ISO)</span>
            <span class="text-[10px] text-[#4338CA]">Requerido</span>
          </label>
          <input
            type="text"
            [value]="taxCountryCode()"
            (input)="taxCountryCode.set($any($event.target).value)"
            placeholder="PE"
            class="w-full px-3.5 py-2.5 text-xs sm:text-sm bg-white/70 border border-purple-soft rounded-xl focus:bg-white focus:outline-none focus:ring-2 focus:ring-[#ACA0E7]/50 focus:border-primary-container text-[#161B2D] shadow-inner font-mono font-medium transition uppercase"
          />
        </div>

      </div>
    </div>

    <!-- Modal Footer Actions -->
    <div class="shrink-0 pt-5 mt-5 border-t border-purple-soft flex flex-col sm:flex-row items-center justify-end gap-3.5">
      <div class="flex items-center space-x-3 w-full sm:w-auto justify-end">
        <button 
          type="button" 
          [disabled]="isSaving()" 
          class="px-4 py-2.5 rounded-xl bg-white/80 hover:bg-white text-[#161B2D] font-semibold text-xs transition border border-purple-soft shadow-xs disabled:opacity-50 cursor-pointer font-mono" 
          (click)="onClose()"
        >
          Cancelar
        </button>
        <button 
          type="submit" 
          [disabled]="isSaving()" 
          class="inline-flex items-center px-6 py-2.5 rounded-xl bg-linear-to-r from-[#ACA0E7] via-[#92AAE7] to-[#4338CA] hover:opacity-95 text-white font-bold text-xs shadow-glass-glow hover:shadow-lg transition-all transform hover:-translate-y-0.5 active:translate-y-0 space-x-2 disabled:opacity-50 cursor-pointer font-mono"
        >
          @if (isSaving()) {
            <svg class="mr-1.5 h-4 w-4 animate-spin text-white" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span>Guardando...</span>
          } @else {
            <svg class="w-4 h-4 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4" />
            </svg>
            <span>{{ isEditing() ? 'Guardar Cambios' : 'Registrar Proveedor' }}</span>
          }
        </button>
      </div>
    </div>
  </form>
</div>
