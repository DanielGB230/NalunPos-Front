<!-- Modal Formulario de Proveedor — 100% Pure Signals (Zero ReactiveFormsModule) -->
<div class="p-6 sm:p-8 max-w-2xl w-full">
  <!-- Encabezado -->
  <div class="flex items-center justify-between pb-4 border-b border-[#DEDAF4] mb-6">
    <div class="flex items-center space-x-3">
      <div class="w-10 h-10 rounded-2xl bg-linear-to-tr from-[#283FA7] to-[#687FE5] text-white flex items-center justify-center font-bold text-lg shadow-sm">
        🏢
      </div>
      <div>
        <h3 class="text-base font-bold text-[#161B2D] font-mono">
          {{ isEditing() ? 'Editar Proveedor' : 'Nuevo Proveedor' }}
        </h3>
        <p class="text-xs text-[#605596]">
          {{ isEditing() ? 'Modifique la información corporativa del proveedor' : 'Registre un nuevo proveedor de productos o servicios' }}
        </p>
      </div>
    </div>
    <button
      (click)="onClose()"
      type="button"
      class="text-[#605596] hover:text-[#161B2D] p-1.5 rounded-xl hover:bg-[#F0EDFB] transition cursor-pointer"
    >
      <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
      </svg>
    </button>
  </div>

  <!-- Formulario con bindings a Signals -->
  <form (submit)="onSubmit(); $event.preventDefault()" class="space-y-4">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

      <!-- Razon Social / Nombre -->
      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-[#161B2D] mb-1 font-mono">
          Razón Social / Nombre Empresa <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          [value]="name()"
          (input)="name.set($any($event.target).value)"
          placeholder="Ej: Distribuidora Central S.A.C."
          class="w-full px-3.5 py-2.5 rounded-xl border border-[#DEDAF4] bg-white/70 text-xs text-[#161B2D] focus:outline-none focus:border-[#687FE5] focus:bg-white font-mono transition"
        />
      </div>

      <!-- Nombre Contacto -->
      <div>
        <label class="block text-xs font-semibold text-[#161B2D] mb-1 font-mono">
          Nombre de Contacto <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          [value]="contactName()"
          (input)="contactName.set($any($event.target).value)"
          placeholder="Ej: Juan Pérez"
          class="w-full px-3.5 py-2.5 rounded-xl border border-[#DEDAF4] bg-white/70 text-xs text-[#161B2D] focus:outline-none focus:border-[#687FE5] focus:bg-white font-mono transition"
        />
      </div>

      <!-- Tax ID (RUC/RFC) -->
      <div>
        <label class="block text-xs font-semibold text-[#161B2D] mb-1 font-mono">
          Tax ID / RUC / RFC <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          [value]="taxId()"
          (input)="taxId.set($any($event.target).value)"
          placeholder="Ej: 20123456789"
          class="w-full px-3.5 py-2.5 rounded-xl border border-[#DEDAF4] bg-white/70 text-xs text-[#161B2D] focus:outline-none focus:border-[#687FE5] focus:bg-white font-mono transition"
        />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-xs font-semibold text-[#161B2D] mb-1 font-mono">
          Correo Electrónico <span class="text-rose-500">*</span>
        </label>
        <input
          type="email"
          [value]="email()"
          (input)="email.set($any($event.target).value)"
          placeholder="contacto@proveedor.com"
          class="w-full px-3.5 py-2.5 rounded-xl border border-[#DEDAF4] bg-white/70 text-xs text-[#161B2D] focus:outline-none focus:border-[#687FE5] focus:bg-white font-mono transition"
        />
      </div>

      <!-- Teléfono -->
      <div>
        <label class="block text-xs font-semibold text-[#161B2D] mb-1 font-mono">
          Teléfono <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          [value]="phone()"
          (input)="phone.set($any($event.target).value)"
          placeholder="+51 987 654 321"
          class="w-full px-3.5 py-2.5 rounded-xl border border-[#DEDAF4] bg-white/70 text-xs text-[#161B2D] focus:outline-none focus:border-[#687FE5] focus:bg-white font-mono transition"
        />
      </div>

      <!-- Dirección / Calle -->
      <div class="sm:col-span-2">
        <label class="block text-xs font-semibold text-[#161B2D] mb-1 font-mono">
          Dirección / Calle <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          [value]="street()"
          (input)="street.set($any($event.target).value)"
          placeholder="Av. Principal 123, Of. 402"
          class="w-full px-3.5 py-2.5 rounded-xl border border-[#DEDAF4] bg-white/70 text-xs text-[#161B2D] focus:outline-none focus:border-[#687FE5] focus:bg-white font-mono transition"
        />
      </div>

      <!-- Ciudad -->
      <div>
        <label class="block text-xs font-semibold text-[#161B2D] mb-1 font-mono">
          Ciudad <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          [value]="city()"
          (input)="city.set($any($event.target).value)"
          placeholder="Lima"
          class="w-full px-3.5 py-2.5 rounded-xl border border-[#DEDAF4] bg-white/70 text-xs text-[#161B2D] focus:outline-none focus:border-[#687FE5] focus:bg-white font-mono transition"
        />
      </div>

      <!-- Código Postal -->
      <div>
        <label class="block text-xs font-semibold text-[#161B2D] mb-1 font-mono">
          Código Postal <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          [value]="zipCode()"
          (input)="zipCode.set($any($event.target).value)"
          placeholder="15001"
          class="w-full px-3.5 py-2.5 rounded-xl border border-[#DEDAF4] bg-white/70 text-xs text-[#161B2D] focus:outline-none focus:border-[#687FE5] focus:bg-white font-mono transition"
        />
      </div>

      <!-- País -->
      <div>
        <label class="block text-xs font-semibold text-[#161B2D] mb-1 font-mono">
          País <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          [value]="country()"
          (input)="country.set($any($event.target).value)"
          placeholder="Perú"
          class="w-full px-3.5 py-2.5 rounded-xl border border-[#DEDAF4] bg-white/70 text-xs text-[#161B2D] focus:outline-none focus:border-[#687FE5] focus:bg-white font-mono transition"
        />
      </div>

      <!-- Código País Tax -->
      <div>
        <label class="block text-xs font-semibold text-[#161B2D] mb-1 font-mono">
          Código País Tax <span class="text-rose-500">*</span>
        </label>
        <input
          type="text"
          [value]="taxCountryCode()"
          (input)="taxCountryCode.set($any($event.target).value)"
          placeholder="PE"
          class="w-full px-3.5 py-2.5 rounded-xl border border-[#DEDAF4] bg-white/70 text-xs text-[#161B2D] focus:outline-none focus:border-[#687FE5] focus:bg-white font-mono transition uppercase"
        />
      </div>

    </div>

    <!-- Botones de Acción -->
    <div class="flex items-center justify-end space-x-3 pt-6 border-t border-[#DEDAF4] mt-6">
      <button
        type="button"
        (click)="onClose()"
        class="px-4 py-2.5 rounded-xl border border-[#DEDAF4] bg-white text-xs font-semibold text-[#605596] hover:bg-[#F0EDFB] transition cursor-pointer"
      >
        Cancelar
      </button>
      <button
        type="submit"
        [disabled]="isSaving()"
        class="px-5 py-2.5 rounded-xl bg-linear-to-r from-[#283FA7] to-[#687FE5] text-white text-xs font-bold font-mono shadow-xs hover:opacity-90 transition disabled:opacity-50 cursor-pointer flex items-center space-x-2"
      >
        @if (isSaving()) {
          <div class="w-3.5 h-3.5 border-2 border-white border-t-transparent rounded-full animate-spin"></div>
          <span>Guardando...</span>
        } @else {
          <span>{{ isEditing() ? 'Guardar Cambios' : 'Registrar Proveedor' }}</span>
        }
      </button>
    </div>
  </form>
</div>
