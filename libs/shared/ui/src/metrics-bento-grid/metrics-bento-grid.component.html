<!-- MetricsBentoGridComponent — @nalunpos/shared/ui -->
<!-- Template: 100% Tailwind CSS — sin SCSS, sin styleUrls -->
<!-- ADR: [class] binding con valores del mapa cardStyles garantiza PurgeCSS correcto -->
<section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">

  @for (card of metrics; track card.label) {
    <div
      class="glass-card p-5 rounded-2xl border border-white flex flex-col justify-between group transition duration-300"
      [ngClass]="cardStyles[card.colorVariant].container"
    >
      <!-- Fila superior: label + indicador esquina derecha -->
      <div class="flex items-center justify-between">
        <span
          class="text-xs font-bold uppercase tracking-wider"
          [ngClass]="cardStyles[card.colorVariant].label"
        >
          {{ card.label }}
        </span>

        <!-- Indicador superior derecho (número, símbolo o checkmark) -->
        <div
          class="w-8 h-8 rounded-xl flex items-center justify-center font-bold text-xs shadow-xs"
          [ngClass]="cardStyles[card.colorVariant].topIndicator"
        >
          @if (card.topIndicatorIsCheck) {
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />
            </svg>
          } @else {
            {{ card.topIndicator }}
          }
        </div>
      </div>

      <!-- Fila media: valor principal + badge -->
      <div class="mt-4 flex items-baseline justify-between">
        <span
          class="font-display text-3xl font-bold"
          [ngClass]="cardStyles[card.colorVariant].valueColor"
        >
          {{ card.value }}
          @if (card.valueSuffix) {
            <span class="text-sm font-normal font-sans text-[#605596]">{{ card.valueSuffix }}</span>
          }
        </span>

        <!-- Badge de contexto -->
        <span
          class="text-xs font-semibold px-2 py-0.5 rounded-md flex items-center shadow-xs font-mono"
          [ngClass]="cardStyles[card.colorVariant].badge"
        >
          @if (card.badgeHasArrow) {
            <svg class="w-3 h-3 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 10l7-7m0 0l7 7m-7-7v18" />
            </svg>
          }
          @if (card.badgeHasPing) {
            <span class="w-1.5 h-1.5 rounded-full bg-[#E8A0BF] mr-1.5 animate-ping"></span>
          }
          {{ card.badge }}
        </span>
      </div>

      <!-- Barra de progreso -->
      <div class="w-full h-1.5 rounded-full mt-3 overflow-hidden" [ngClass]="cardStyles[card.colorVariant].track">
        <div
          class="h-full rounded-full"
          [ngClass]="cardStyles[card.colorVariant].progress"
          [style.width.%]="card.progressPercent"
        ></div>
      </div>
    </div>
  }

</section>
