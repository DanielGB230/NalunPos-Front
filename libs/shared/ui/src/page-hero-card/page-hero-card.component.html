<!-- PageHeroCardComponent — @nalunpos/shared/ui -->
<!-- Template: 100% Tailwind CSS — sin SCSS, sin styleUrls -->
<section class="relative rounded-3xl p-7 lg:p-8 glass-card border border-white overflow-hidden shadow-glass-lg">

  <!-- Imagen decorativa derecha (decorativa, pointer-events desactivado) -->
  <div class="absolute right-0 top-0 w-1/3 h-full opacity-40 lg:opacity-55 pointer-events-none mix-blend-multiply flex items-center justify-end">
    <img
      [src]="config.imageUrl"
      [alt]="config.imageAlt ?? config.titleHighlight"
      class="object-cover h-full w-full object-center rounded-3xl"
    />
  </div>

  <!-- Orbe de luz decorativo -->
  <div class="absolute -top-24 left-1/3 w-80 h-80 bg-[#DEDAF4]/30 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Contenido principal -->
  <div class="relative z-10 flex flex-col md:flex-row md:items-center justify-between gap-6">

    <!-- Bloque de texto -->
    <div class="max-w-2xl space-y-2.5">
      <!-- Badge de contexto -->
      <div class="inline-flex items-center space-x-2 px-3 py-1 rounded-full bg-[#DBE6FB]/80 border border-[#92AAE7]/40 backdrop-blur-md">
        <span class="w-1.5 h-1.5 rounded-full bg-[#605596]"></span>
        <span class="text-[10px] font-bold uppercase tracking-widest text-[#605596] font-mono">{{ config.badge }}</span>
      </div>

      <!-- Título con resaltado en gradiente -->
      <h1 class="font-display font-bold text-3xl sm:text-4xl lg:text-5xl text-[#161B2D] tracking-tight leading-tight">
        {{ config.title }}
        <span class="bg-linear-to-r from-[#605596] via-[#ACA0E7] to-[#92AAE7] bg-clip-text text-transparent">
          {{ config.titleHighlight }}
        </span>
      </h1>

      <!-- Descripción -->
      <p class="text-sm sm:text-base text-[#605596] font-normal leading-relaxed">{{ config.description }}</p>
    </div>

    <!-- Acciones -->
    <div class="flex flex-wrap items-center gap-3 shrink-0">

      <!-- Botón secundario (glass surface) -->
      @if (config.secondaryAction) {
        <button
          type="button"
          (click)="secondaryActionClick.emit()"
          class="inline-flex items-center px-4 py-2.5 rounded-xl glass-surface hover:bg-white text-[#161B2D] font-semibold text-xs transition border border-[#DEDAF4] shadow-xs hover:shadow cursor-pointer"
        >
          <!-- Ícono de descarga/exportar -->
          <svg class="w-4 h-4 mr-2 text-[#ACA0E7]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
          </svg>
          {{ config.secondaryAction.label }}
        </button>
      }

      <!-- Botón primario (gradiente lila-cobalto) -->
      @if (config.primaryAction) {
        <button
          type="button"
          (click)="primaryActionClick.emit()"
          class="inline-flex items-center px-5 py-2.5 rounded-xl bg-linear-to-r from-[#ACA0E7] via-[#92AAE7] to-[#687FE5] hover:opacity-95 text-white font-bold text-xs shadow-glass-glow hover:shadow-lg transition-all transform hover:-translate-y-0.5 active:translate-y-0 cursor-pointer"
        >
          <!-- Ícono de + -->
          <svg class="w-4 h-4 mr-1.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4" />
          </svg>
          {{ config.primaryAction.label }}
        </button>
      }

    </div>
  </div>
</section>
