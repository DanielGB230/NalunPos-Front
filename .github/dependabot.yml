version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '04:00'
      timezone: 'America/Bogota'
    open-pull-requests-limit: 10
    commit-message:
      prefix: 'chore(deps)'
      include: 'scope'
    labels:
      - 'dependencies'
      - 'frontend'
    groups:
      angular:
        patterns:
          - '@angular*'
      vitest:
        patterns:
          - '@vitest*'
          - 'vitest*'
      playwright:
        patterns:
          - '@playwright*'
          - 'playwright*'
      linting:
        patterns:
          - 'eslint*'
          - '@typescript-eslint*'
          - 'prettier*'
